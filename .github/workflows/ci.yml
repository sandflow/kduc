name: CI

on:
  push:
    branches: [main]
  pull_request:

# Required so the job can request a GitHub OIDC token to assume the AWS role.
permissions:
  id-token: write
  contents: read

env:
  # Repository (or org) variables -- see README/CONTRIBUTING for setup notes.
  AWS_REGION: ${{ vars.AWS_REGION }}
  KDU_SDK_S3_URI: ${{ vars.KDU_SDK_S3_URI }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KDU_PLATFORM: Linux-x86-64-gcc
    steps:
      - name: Check out kduc
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Kakadu SDK from S3
        run: |
          aws s3 cp "$KDU_SDK_S3_URI" kdu-sdk.zip
          unzip -q kdu-sdk.zip
          echo "KDU_SDK_DIR=$(basename "$KDU_SDK_S3_URI" .zip)" >> "$GITHUB_ENV"

      - name: Build Kakadu SDK static libraries
        env:
          KDU_STATIC_BUILD: "1"
        run: make -C "$KDU_SDK_DIR/make" -f "Makefile-$KDU_PLATFORM" all_but_jni

      - name: Configure kduc
        run: |
          cmake -S . -B build \
            -DKDU_LIBRARY="$GITHUB_WORKSPACE/$KDU_SDK_DIR/lib/$KDU_PLATFORM/libkdu.a" \
            -DKDU_AUX_LIBRARY="$GITHUB_WORKSPACE/$KDU_SDK_DIR/lib/$KDU_PLATFORM/libkdu_aux.a" \
            -DKDU_INCLUDE_DIR="$GITHUB_WORKSPACE/$KDU_SDK_DIR/managed/all_includes" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"

      - name: Build kduc
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out kduc
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Kakadu SDK from S3
        run: |
          aws s3 cp "%KDU_SDK_S3_URI%" kdu-sdk.zip || exit /b 1
          7z x -bd kdu-sdk.zip > nul || exit /b 1
          set "SDK_URI=%KDU_SDK_S3_URI:/=\%"
          for %%F in ("%SDK_URI%") do echo KDU_SDK_DIR=%%~nF>>"%GITHUB_ENV%"

      # The Visual Studio projects build DLLs and write them, and their import
      # libraries, to bin_x64 and lib_x64 next to the SDK directory.
      - name: Build Kakadu SDK DLLs
        run: |
          msbuild "%KDU_SDK_DIR%\coresys\coresys_2022.sln" -p:Configuration=Release -p:Platform=x64 -m -v:minimal || exit /b 1
          msbuild "%KDU_SDK_DIR%\managed\kdu_managed_2022.sln" -t:kdu_aux -p:Configuration=Release -p:Platform=x64 -m -v:minimal || exit /b 1
          echo %GITHUB_WORKSPACE%\bin_x64>>"%GITHUB_PATH%"

      - name: Configure kduc
        run: |
          set "WS=%GITHUB_WORKSPACE:\=/%"
          for %%F in ("%GITHUB_WORKSPACE%\lib_x64\kdu_v*R.lib") do set "KDU_LIB=%%F"
          for %%F in ("%GITHUB_WORKSPACE%\lib_x64\kdu_a*R.lib") do set "KDU_AUX_LIB=%%F"
          cmake -S . -B build ^
            -DKDU_LIBRARY="%KDU_LIB:\=/%" ^
            -DKDU_AUX_LIBRARY="%KDU_AUX_LIB:\=/%" ^
            -DKDU_INCLUDE_DIR="%WS%/%KDU_SDK_DIR%/managed/all_includes" ^
            -DCMAKE_INSTALL_PREFIX="%WS%/install"

      - name: Build kduc
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release
